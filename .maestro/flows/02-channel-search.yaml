appId: com.shook.app
name: 02-channel-search
tags:
  - core
---
- launchApp:
    permissions:
      all: deny
- extendedWaitUntil:
    visible:
      id: "screen-channels"
    timeout: 30000
- tapOn:
    id: "channel-search-open"
- assertVisible:
    id: "screen-channel-search"
- tapOn:
    id: "channel-search-input"
- inputText: "add-target"
- extendedWaitUntil:
    visible:
      id: "channel-row-e2e-channel-add-target"
    timeout: 10000
- assertVisible:
    id: "channel-add-e2e-channel-add-target"
- tapOn:
    id: "channel-search-back"
- assertVisible:
    id: "screen-channels"
