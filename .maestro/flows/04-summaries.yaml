appId: com.shook.app
name: 04-summaries
tags:
  - core
---
- launchApp:
    permissions:
      all: deny
- extendedWaitUntil:
    visible:
      id: "screen-channels"
    timeout: 30000
- tapOn:
    id: "tab-summaries"
- extendedWaitUntil:
    visible:
      id: "summary-row-e2e-video-completed-latest"
    timeout: 15000
- tapOn:
    id: "summary-row-e2e-video-completed-latest"
- extendedWaitUntil:
    visible:
      id: "summary-detail-e2e-video-completed-latest"
    timeout: 10000
- assertVisible:
    id: "summary-detail-scroll"

